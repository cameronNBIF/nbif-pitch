<style>
  /* ── NBIF Pitch Intake Form Styles ────────────────────────────── */
  .nbif-pitch-form {
    max-width: 680px;
    margin: 0 auto;
    font-family: inherit;
  }

  .nbif-pitch-form h2 {
    margin-bottom: 0.5em;
  }

  .nbif-pitch-form p.form-intro {
    color: #555;
    margin-bottom: 2em;
    line-height: 1.6;
  }

  .nbif-pitch-form .form-group {
    margin-bottom: 1.5em;
  }

  .nbif-pitch-form label {
    display: block;
    font-weight: 600;
    margin-bottom: 0.4em;
    font-size: 0.95em;
  }

  .nbif-pitch-form label .required {
    color: #c0392b;
    margin-left: 2px;
  }

  .nbif-pitch-form label .optional {
    color: #888;
    font-weight: 400;
    font-size: 0.85em;
    margin-left: 4px;
  }

  .nbif-pitch-form input[type="text"],
  .nbif-pitch-form input[type="email"],
  .nbif-pitch-form input[type="tel"],
  .nbif-pitch-form input[type="url"],
  .nbif-pitch-form input[type="date"],
  .nbif-pitch-form input[type="number"],
  .nbif-pitch-form select,
  .nbif-pitch-form textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 1em;
    font-family: inherit;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }

  .nbif-pitch-form input:focus,
  .nbif-pitch-form select:focus,
  .nbif-pitch-form textarea:focus {
    outline: none;
    border-color: #2a5aa7;
    box-shadow: 0 0 0 2px rgba(42, 90, 167, 0.15);
  }

  .nbif-pitch-form textarea {
    min-height: 100px;
    resize: vertical;
  }

  .nbif-pitch-form .form-row {
    display: flex;
    gap: 1.5em;
  }

  .nbif-pitch-form .form-row .form-group {
    flex: 1;
  }

  .nbif-pitch-form .conditional-field {
    display: none;
  }

  .nbif-pitch-form .conditional-field.visible {
    display: block;
  }

  .nbif-pitch-form button[type="submit"] {
    background-color: #0d96d4;
    color: #fff;
    border: none;
    padding: 14px 36px;
    font-size: 1.05em;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.2s;
    width: 100%;
    margin-top: 0.5em;
  }

  .nbif-pitch-form button[type="submit"]:hover {
    background-color: #1e4a8a;
  }

  .nbif-pitch-form button[type="submit"]:disabled {
    background-color: #94a3b8;
    cursor: not-allowed;
  }

  .nbif-pitch-form .form-error {
    color: #c0392b;
    font-size: 0.85em;
    margin-top: 0.3em;
    display: none;
  }

  .nbif-pitch-form .form-message {
    padding: 16px;
    border-radius: 4px;
    margin-top: 1em;
    display: none;
    font-size: 0.95em;
    line-height: 1.5;
  }

  .nbif-pitch-form .form-message.success {
    background-color: #d4edda;
    color: #155724;
    border: 1px solid #c3e6cb;
    display: block;
  }

  .nbif-pitch-form .form-message.error {
    background-color: #f8d7da;
    color: #721c24;
    border: 1px solid #f5c6cb;
    display: block;
  }

  /* Responsive: stack side-by-side fields on mobile */
  @media (max-width: 600px) {
    .nbif-pitch-form .form-row {
      flex-direction: column;
      gap: 0;
    }
  }
</style>

<div class="nbif-pitch-form">
  <h2>Submit a Pitch</h2>
  <p class="form-intro">
    Interested in pitching to NBIF? Fill out the form below and our team will review your submission and be in touch.
  </p>

  <form id="nbifPitchForm" novalidate>
    <!-- Row: First Name / Last Name -->
    <div class="form-row">
      <div class="form-group">
        <label for="first_name">First Name <span class="required">*</span></label>
        <input type="text" id="first_name" name="first_name" required>
        <div class="form-error" id="err-first_name"></div>
      </div>
      <div class="form-group">
        <label for="last_name">Last Name <span class="required">*</span></label>
        <input type="text" id="last_name" name="last_name" required>
        <div class="form-error" id="err-last_name"></div>
      </div>
    </div>

    <!-- Business Name -->
    <div class="form-group">
      <label for="business_name">Business Name <span class="required">*</span></label>
      <input type="text" id="business_name" name="business_name" required>
      <div class="form-error" id="err-business_name"></div>
    </div>

    <!-- Row: Email / Phone -->
    <div class="form-row">
      <div class="form-group">
        <label for="email">Email <span class="required">*</span></label>
        <input type="email" id="email" name="email" required>
        <div class="form-error" id="err-email"></div>
      </div>
      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required>
        <div class="form-error" id="err-phone"></div>
      </div>
    </div>

    <!-- Website -->
    <div class="form-group">
      <label for="website">Website <span class="optional">(optional)</span></label>
      <input type="url" id="website" name="website" placeholder="https://yourcompany.com">
    </div>

    <!-- Priority Sector -->
    <div class="form-group">
      <label for="sector">Priority Sector <span class="required">*</span></label>
      <select id="sector" name="sector" required>
        <option value="">Select a sector...</option>
        <option value="Advanced Manufacturing">Advanced Manufacturing</option>
        <option value="Agritech">Agritech</option>
        <option value="Cybersecurity">Cybersecurity</option>
        <option value="Digital Health">Digital Health</option>
        <option value="Energy">Energy</option>
        <option value="Forestry">Forestry</option>
        <option value="ICT">ICT</option>
        <option value="Other">Other</option>
      </select>
      <div class="form-error" id="err-sector"></div>
    </div>

    <!-- Venture Stage -->
    <div class="form-group">
      <label for="venture_stage">Venture Stage <span class="required">*</span></label>
      <select id="venture_stage" name="venture_stage" required>
        <option value="">Select a stage...</option>
        <option value="Research or Lab Stage">Idea to Proof of Concept - Research or Lab Stage</option>
        <option value="Accelerator Stage">Proof of Concept to Prototype - Accelerator Stage</option>
        <option value="Pre-seed">Prototype to MVP (Minimum Viable Product) - Pre-seed</option>
        <option value="Seed">MVP to Early Customer Traction - Seed</option>
        <option value="Series A">Early Customer Traction to Strong Adoption - Series A</option>
      </select>
      <div class="form-error" id="err-venture_stage"></div>
    </div>

    <!-- Date of Incorporation -->
    <div class="form-group">
      <label for="date_of_incorporation">Date of Incorporation <span class="optional">(optional)</span></label>
      <input type="date" id="date_of_incorporation" name="date_of_incorporation">
    </div>

    <!-- Row: Investment Round Size / Potential Investment Amount -->
    <div class="form-row">
      <div class="form-group">
        <label for="investment_round_size">Investment Round Size ($) <span class="optional">(optional)</span></label>
        <input type="number" id="investment_round_size" name="investment_round_size" min="0" step="1" placeholder="e.g. 500000">
      </div>
      <div class="form-group">
        <label for="potential_investment_amount">Potential NBIF Investment ($) <span class="optional">(optional)</span></label>
        <input type="number" id="potential_investment_amount" name="potential_investment_amount" min="0" step="1" placeholder="e.g. 100000">
      </div>
    </div>

    <!-- Discovery -->
    <div class="form-group">
      <label for="discovery">How did you hear about NBIF? <span class="optional">(optional)</span></label>
      <input type="text" id="discovery" name="discovery" placeholder="e.g. Referral, website, event...">
    </div>

    <!-- Accelerators -->
    <div class="form-group">
      <label for="accelerators">Accelerators <span class="optional">(optional)</span></label>
      <input type="text" id="accelerators" name="accelerators" placeholder="e.g. Propel ICT, Energia Ventures, Venn Innovation...">
    </div>

    <!-- Turnstile CAPTCHA -->
    <div class="form-group">
      <div class="cf-turnstile" data-sitekey="0x4AAAAAADdxA0a6pFBdP5eT" data-theme="light"></div>
      <div class="form-error" id="err-captcha"></div>
    </div>

    <!-- Submit -->
    <button type="submit" id="submitBtn">Submit Pitch</button>

    <!-- Messages -->
    <div class="form-message" id="formMessage"></div>
  </form>
</div>

<script>
(function() {
  'use strict';
  //Useless comment
  var ENDPOINT = 'https://AZURE_FUNCTION_DEFAULT_DOMAIN/api/pitch-intake?code=AZURE_FUNCTION_DEFAULT_APP_KEY';

  var form = document.getElementById('nbifPitchForm');
  var submitBtn = document.getElementById('submitBtn');
  var messageDiv = document.getElementById('formMessage');

  // ── Client-side validation ──────────────────────────────────────

  function clearErrors() {
    var errs = form.querySelectorAll('.form-error');
    for (var i = 0; i < errs.length; i++) {
      errs[i].style.display = 'none';
      errs[i].textContent = '';
    }
  }

  function showError(fieldId, msg) {
    var el = document.getElementById('err-' + fieldId);
    if (el) {
      el.textContent = msg;
      el.style.display = 'block';
    }
  }

  function validate() {
    clearErrors();
    var valid = true;

    // Required text fields
    var required = [
      { id: 'first_name', label: 'First Name' },
      { id: 'last_name', label: 'Last Name' },
      { id: 'business_name', label: 'Business Name' },
      { id: 'email', label: 'Email' },
      { id: 'phone', label: 'Phone Number' }
    ];

    for (var i = 0; i < required.length; i++) {
      var field = required[i];
      var val = (form.elements[field.id].value || '').trim();
      if (!val) {
        showError(field.id, field.label + ' is required.');
        valid = false;
      }
    }

    // Email format
    var email = (form.elements['email'].value || '').trim();
    if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('email', 'Please enter a valid email address.');
      valid = false;
    }

    // Required dropdowns
    if (!form.elements['sector'].value) {
      showError('sector', 'Please select a sector.');
      valid = false;
    }
    if (!form.elements['venture_stage'].value) {
      showError('venture_stage', 'Please select a venture stage.');
      valid = false;
    }

    // Turnstile token
    var turnstileInput = form.querySelector('input[name="cf-turnstile-response"]');
    if (!turnstileInput || !turnstileInput.value) {
      showError('captcha', 'Please complete the verification check.');
      valid = false;
    }

    return valid;
  }

  // ── Form submission ─────────────────────────────────────────────

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    if (!validate()) return;

    // Disable button to prevent double-submit
    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';
    messageDiv.className = 'form-message';
    messageDiv.style.display = 'none';

    // Build FormData
    var formData = new FormData();
    formData.append('first_name', form.elements['first_name'].value.trim());
    formData.append('last_name', form.elements['last_name'].value.trim());
    formData.append('business_name', form.elements['business_name'].value.trim());
    formData.append('email', form.elements['email'].value.trim());
    formData.append('phone', form.elements['phone'].value.trim());
    formData.append('website', form.elements['website'].value.trim());
    formData.append('sector', form.elements['sector'].value);
    formData.append('venture_stage', form.elements['venture_stage'].value);
    formData.append('date_of_incorporation', form.elements['date_of_incorporation'].value);
    formData.append('discovery', form.elements['discovery'].value.trim());
    formData.append('accelerators', form.elements['accelerators'].value.trim());

    // Number fields — send only if provided
    var roundSize = form.elements['investment_round_size'].value;
    if (roundSize) formData.append('investment_round_size', roundSize);

    var potentialAmount = form.elements['potential_investment_amount'].value;
    if (potentialAmount) formData.append('potential_investment_amount', potentialAmount);

    // Turnstile token
    var turnstileInput = form.querySelector('input[name="cf-turnstile-response"]');
    if (turnstileInput) {
      formData.append('cf-turnstile-response', turnstileInput.value);
    }

    // Send to Azure Function
    fetch(ENDPOINT, {
      method: 'POST',
      body: formData
    })
    .then(function(response) {
      return response.json().then(function(data) {
        return { ok: response.ok, status: response.status, data: data };
      });
    })
    .then(function(result) {
      if (result.ok) {
        // Success
        messageDiv.className = 'form-message success';
        messageDiv.textContent = 'Thank you for your submission! Our team will review your pitch and be in touch.';
        messageDiv.style.display = 'block';
        form.reset();
        // Reset Turnstile widget for a fresh token
        if (window.turnstile) window.turnstile.reset();
        // Hide the form fields
        var fieldsets = form.querySelectorAll('.form-group, .form-row, button[type="submit"]');
        for (var i = 0; i < fieldsets.length; i++) {
          fieldsets[i].style.display = 'none';
        }
      } else {
        // Server returned an error
        var errorMsg = result.data.error || 'Something went wrong. Please try again.';
        if (result.data.details && result.data.details.length) {
          errorMsg += '\n' + result.data.details.join('\n');
        }
        messageDiv.className = 'form-message error';
        messageDiv.textContent = errorMsg;
        messageDiv.style.display = 'block';
        // Re-enable submit
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit Pitch';
        // Reset Turnstile for a fresh token
        if (window.turnstile) window.turnstile.reset();
      }
    })
    .catch(function(err) {
      messageDiv.className = 'form-message error';
      messageDiv.textContent = 'A network error occurred. Please check your connection and try again.';
      messageDiv.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Submit Pitch';
      if (window.turnstile) window.turnstile.reset();
    });
  });

})();
</script>
